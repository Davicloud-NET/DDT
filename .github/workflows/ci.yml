name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Every job only reads the repository, and none needs a secret, so a pull request from a fork runs the same checks.
permissions:
  contents: read

# A newer push to a pull request stops the checks of the one before. Every commit on master keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  ASPIRE_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ github.job }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ github.job }}-

      # DDT.AppHost's build fetches Aspire's CLI and bundle where they are missing, once, and fails when that does not
      # work the first time. Fetched here they are tried again, and the build finds them in place.
      - name: Get Aspire's bundle
        shell: pwsh
        run: ./build/Get-AspireBundle.ps1

      - name: Build
        run: dotnet build DDT.slnx

      - name: Check the C# formatting
        run: dotnet format whitespace DDT.slnx --verify-no-changes --no-restore

      # Now and then the analyzer fails with a NullReferenceException of its own, which the next run does not repeat.
      - name: Check the PowerShell scripts
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          for ($attempt = 1; ; $attempt++) {
            try {
              $findings = @(Invoke-ScriptAnalyzer -Path build -Recurse -Settings build/PSScriptAnalyzerSettings.psd1 -ErrorAction Stop)
              break
            }
            catch {
              if ($attempt -ge 3 -or $_.Exception.GetBaseException() -isnot [System.NullReferenceException]) { throw }
              Write-Host "PSScriptAnalyzer failed on its own. Trying again."
            }
          }
          $findings | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap
          if ($findings.Count -gt 0) { throw "PSScriptAnalyzer found $($findings.Count) problems in build/." }

      # Proves the WiX sources still build. Without the web UI, which the web job checks, and without the agent and
      # console, which the end to end job compiles.
      - name: Build the MSI
        shell: powershell
        run: .\build\Build-Installer.ps1 -SkipWeb -SkipAgent

      # Docker on a Windows runner runs Windows containers, so the PostgreSQL tests could not start theirs. With Docker
      # stopped they skip, as on a PC where it is not running, and the Linux job runs them.
      - name: Stop Docker
        run: if (Get-Service docker -ErrorAction SilentlyContinue) { Stop-Service docker }

      - name: Test
        run: dotnet test --solution DDT.slnx --no-build -- --filter-not-trait "Category=E2E" --ignore-exit-code 8

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ github.job }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ github.job }}-

      # DDT.AppHost's build fetches Aspire's CLI and bundle where they are missing, once, and fails when that does not
      # work the first time. Fetched here they are tried again, and the build finds them in place.
      - name: Get Aspire's bundle
        shell: pwsh
        run: ./build/Get-AspireBundle.ps1

      # The agent's Windows executable and the console target Windows and are tested in the Windows job. They build
      # here as well, because the test of THIRD-PARTY-NOTICES.md reads what their restore resolved.
      - name: Build
        run: dotnet build DDT.slnx -p:EnableWindowsTargeting=true

      # The server runs on Linux in its container, so its tests run here too. Some run only here: the PostgreSQL
      # tests, which start PostgreSQL in Docker, and the one of an administrator's intermediate certificate. The
      # agent's library, DDT.Agent.Core, is the agent on every system, so its tests run here as well. Those of the
      # agent for Linux, DDT.Agent.Linux, run in both jobs, and the ones that call the Linux kernel only here.
      - name: Test
        run: |
          status=0
          for project in DDT.Agent.Core.Tests DDT.Agent.Linux.Tests DDT.Core.Tests DDT.Protocols.Tests DDT.Pxe.Tests DDT.Server.Tests; do
            dotnet test --project "tests/$project" --no-build || status=1
          done
          exit $status

  linux-agent:
    name: Linux agent
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A release gives the agent the server's version. Here it has only to be one the checks below can look for.
      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = ./build/Get-Version.ps1 -AllowShallow
          "version=$version" >> $env:GITHUB_OUTPUT
          "DDT $version"

      # NativeAOT does not compile across systems or C libraries, so the agent for Linux is compiled against musl in
      # the Alpine container build/Dockerfile.agent-linux names, as build/Publish-LinuxAgent.ps1 does it.
      - name: Publish the agent
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/Dockerfile.agent-linux
          target: export
          platforms: linux/amd64
          build-args: DDT_VERSION=${{ steps.version.outputs.version }}
          outputs: type=local,dest=artifacts/agent-linux
          cache-from: type=gha,scope=linux-agent
          cache-to: type=gha,mode=max,scope=linux-agent

      # The boot environment has no library to lend the agent, and the server reads the agent's version out of the
      # file, since an ELF file has no version resource.
      - name: Check that the agent is static and carries its version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          agent=artifacts/agent-linux/ddt-agent
          file "$agent"
          if readelf --program-headers --dynamic "$agent" | grep --extended-regexp 'INTERP|NEEDED'; then
            echo "ddt-agent names an interpreter or a library, so it is not static."
            exit 1
          fi
          strings "$agent" | grep --fixed-strings --line-regexp "DDT-AGENT-VERSION:$VERSION"

      # In an image that holds nothing else, so the agent shows that it needs nothing of the system it runs on. It
      # prints every licence text it embeds, and the last of them is the one of the compiler's runtime.
      - name: Print the agent's licences in an empty container
        run: |
          printf 'FROM scratch\nCOPY ddt-agent /ddt-agent\n' | docker buildx build --load --quiet --tag ddt-agent:ci --file - artifacts/agent-linux
          docker run --rm ddt-agent:ci /ddt-agent --licenses > licenses.txt
          wc --bytes licenses.txt
          for text in 'GNU GENERAL PUBLIC LICENSE' 'The agent for Linux, `ddt-agent`' 'OpenSSL' 'musl as a whole is licensed' 'GCC RUNTIME LIBRARY EXCEPTION'; do
            grep --fixed-strings --quiet "$text" licenses.txt || { echo "The licences lack: $text"; exit 1; }
          done

      # For the job that builds the boot environment around it, and for the image the container job builds.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-agent
          path: artifacts/agent-linux/ddt-agent
          if-no-files-found: error
          retention-days: 1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ github.job }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ github.job }}-

      # The end-to-end tests' part for Linux: the host as the container runs it, built here, and a dry run of a Linux
      # sequence with the file from above. The other end-to-end tests take the agent for Windows and skip here, so
      # only this part is asked for, and a skip of it fails instead of passing unnoticed.
      - name: Test end to end with the agent for Linux
        env:
          DDT_E2E_AGENT: ${{ github.workspace }}/artifacts/agent-linux/ddt-agent
        run: dotnet test --project tests/DDT.E2E -- --filter-trait "Agent=Linux" --fail-skips on

  linux-boot:
    name: Linux boot environment
    needs: linux-agent
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-agent
          path: artifacts/agent-linux

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Read the lock
        id: lock
        run: |
          echo "tools=$(jq --raw-output .toolsImage build/LinuxBoot/packages.lock.json)" >> "$GITHUB_OUTPUT"
          echo "base=$(jq --raw-output .expected.baseImageSha256 build/LinuxBoot/packages.lock.json)" >> "$GITHUB_OUTPUT"

      # As build/Build-LinuxBoot.ps1 -AgentFolder builds it: Debian's packages as the lock pins them, and the agent
      # of the job before in ddt.img. The cache keeps the downloads, which the build checks against the lock's hashes.
      - name: Build the boot environment
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: build/LinuxBoot
          file: build/LinuxBoot/Dockerfile
          target: export
          platforms: linux/amd64
          build-args: TOOLS_IMAGE=${{ steps.lock.outputs.tools }}
          build-contexts: agent=artifacts/agent-linux
          outputs: type=local,dest=artifacts/linux-boot
          cache-from: type=gha,scope=linux-boot
          cache-to: type=gha,mode=max,scope=linux-boot

      # One lock has to give one base.img on every computer, or one nobody tested would ship unnoticed. When its
      # start scripts or lists changed, build/Update-LinuxBootLock.ps1 -BaseImageOnly writes the new hash into the lock.
      - name: Compare base.img with the one the lock expects
        env:
          EXPECTED: ${{ steps.lock.outputs.base }}
        run: |
          echo "$EXPECTED  artifacts/linux-boot/base.img" | sha256sum --check
          jq --raw-output '.files[] | "\(.sha256)  \(.name)"' artifacts/linux-boot/ddt-linux-boot.json | (cd artifacts/linux-boot && sha256sum --check)
          echo "$(jq --raw-output .agent.sha256 artifacts/linux-boot/ddt-linux-boot.json)  artifacts/agent-linux/ddt-agent" | sha256sum --check

      # -x and -P let it follow the scripts into common.sh, which they read from where the boot environment has it.
      - name: Check the start scripts
        run: |
          shellcheck --shell=sh -x -P build/LinuxBoot/rootfs \
            build/LinuxBoot/rootfs/init build/LinuxBoot/rootfs/etc/init.d/rcS build/LinuxBoot/rootfs/usr/lib/ddt/* \
            build/LinuxBoot/placeholder/ddt-agent build/LinuxBoot/test/hooks/* build/LinuxBoot/test/watch/* \
            build/LinuxBoot/sources.sh
          shellcheck --shell=sh src/DDT.Core/CloudInit/vendor-data.sh

      # The console's keyboard tables come from the lock's snapshot too: a table edited by hand, or a lock that moved
      # without them, fails here.
      - name: Check the keyboard tables
        shell: pwsh
        run: ./build/Update-KeyboardLayouts.ps1 -Check

      # GitHub's Linux runners have KVM, and its device belongs to a group the runner's user is not in. Without KVM
      # QEMU would emulate the processor, and the checks would take many times as long.
      - name: Let the runner's user start virtual machines
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -w /dev/kvm

      - name: Build the image the checks run in
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: build/LinuxBoot
          file: build/LinuxBoot/test/Dockerfile
          platforms: linux/amd64
          build-args: TOOLS_IMAGE=${{ steps.lock.outputs.tools }}
          load: true
          tags: ddt-linux-boot-test:ci
          cache-from: type=gha,scope=linux-boot-test
          cache-to: type=gha,mode=max,scope=linux-boot-test

      # As build/Test-LinuxBoot.ps1 runs it: the firmware has Microsoft's keys and starts the shim over TFTP, as a PC
      # does. The container is privileged because QEMU needs /dev/kvm.
      - name: Boot it in QEMU with Secure Boot on
        run: |
          mkdir --parents artifacts/linux-boot-test
          docker run --rm --privileged --volume "$PWD/artifacts/linux-boot:/boot-files:ro" \
            --volume "$PWD/artifacts/linux-boot-test:/out" ddt-linux-boot-test:ci

      - name: Keep the serial logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-boot-serial-logs
          path: artifacts/linux-boot-test/
          retention-days: 14

      # For the image the container job builds.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-boot
          path: artifacts/linux-boot/
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: End to end
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ github.job }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-${{ github.job }}-

      # The tests publish the agent with NativeAOT, which needs the Visual C++ build tools, and skip without them. Here
      # a skip would pass unnoticed, so the job fails first.
      - name: Check for the Visual C++ build tools
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $tools = & $vswhere -latest -prerelease -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $tools) { throw 'vswhere finds no Visual C++ build tools, so the end-to-end tests would skip.' }
          "Visual C++ build tools: $tools"

      - name: Test
        run: dotnet test --project tests/DDT.E2E

  web:
    name: Web client
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/DDT.Web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: src/DDT.Web/.nvmrc
          cache: npm
          cache-dependency-path: src/DDT.Web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check the formatting
        run: npm run format

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  screens:
    name: Web screenshots
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/DDT.Web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: src/DDT.Web/.nvmrc
          cache: npm
          cache-dependency-path: src/DDT.Web/package-lock.json

      - name: Install
        run: npm ci

      # The screenshots in screens/__screenshots__ are taken on Windows, and the checks draw the pages in the Microsoft
      # Edge the runner has.
      - name: Compare the screenshots
        run: npm run screens

      - name: Keep what differed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot-differences
          path: src/DDT.Web/test-results/
          retention-days: 14

  container:
    name: Container image
    needs: [linux-agent, linux-boot]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Where build/Dockerfile looks for what a release puts next to the server. The agent for Windows and the
      # console are compiled on Windows alone, so this image has none of them.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-boot
          path: artifacts/bundle/linux-boot

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-agent
          path: artifacts/agent-linux

      - name: Put the agent for Linux beside the boot environment
        run: cp artifacts/agent-linux/ddt-agent artifacts/bundle/ddt-agent-linux-x64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built to prove that build/Dockerfile still builds and that the server starts in the image; nothing is pushed.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/Dockerfile
          load: true
          tags: ddt:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # With the image's defaults the server makes its own certificate and a SQLite database, and answers for the About
      # page without a sign-in.
      - name: Start the server in the image
        run: |
          docker run --detach --name ddt --publish 8443:8443 ddt:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent --insecure https://localhost:8443/api/about; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs ddt
          exit 1

      # With netboot on, the server says at its start what it starts machines in. The agent's route is open to
      # every machine, so it answers without a sign-in.
      - name: Check that the server offers the Linux files the image holds
        run: |
          docker run --detach --name ddt-netboot --publish 9443:8443 --env DDT__Roles=web,pxe --env DDT__Pxe__Interfaces=eth0 ddt:ci
          expected=$(sha256sum artifacts/bundle/ddt-agent-linux-x64 | cut --delimiter=' ' --fields=1)
          said='Linux boot environment: Tftp linux/shimx64.efi from /app/linux-boot'
          for attempt in $(seq 1 30); do
            docker logs ddt-netboot > netboot.log 2>&1
            if curl --fail --silent --insecure --output release.json https://localhost:9443/api/agents/releases/linux-x64; then
              if grep --fixed-strings --quiet "$said" netboot.log; then break; fi
            fi
            sleep 2
          done
          docker rm --force ddt-netboot
          cat release.json
          jq --exit-status --arg sha256 "$expected" '.sha256 == $sha256' release.json
          grep --fixed-strings "$said" netboot.log

      - name: Check install.sh
        run: shellcheck --shell=sh build/install.sh

      # On the runner itself, which is a Linux host with Docker as install.sh wants one. The second run is an upgrade.
      - name: Install with install.sh
        run: |
          docker rm --force ddt
          mkdir release
          cp build/compose.release.yaml release/compose.yaml
          (cd release && sha256sum compose.yaml > SHA256SUMS)
          sudo sh build/install.sh --source "$PWD/release" --image ddt:ci --firewall no --names ddt.example
          sudo grep --quiet '^DDT_HOSTNAMES=.*,ddt.example$' /opt/ddt/.env
          sudo sh build/install.sh --source "$PWD/release" --image ddt:ci --firewall no --port 9443
          sudo grep --quiet '^DDT_PORT=8443$' /opt/ddt/.env
          curl --fail --silent --insecure https://localhost:8443/api/about
