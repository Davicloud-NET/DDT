name: Release

# A tag like v0.1.0 publishes DDT.msi, install.ps1 and SHA256SUMS as a GitHub release, the winget manifests as an
# artifact, and the container image to ghcr.io/davicloud-net/ddt.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  windows:
    name: MSI
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Build the MSI
        shell: powershell
        run: .\build\Build-Installer.ps1 -Version ($env:GITHUB_REF_NAME.TrimStart('v'))

      - name: Write the winget manifests
        shell: powershell
        run: .\build\New-WingetManifest.ps1 -Msi artifacts\installer\DDT.msi -Version ($env:GITHUB_REF_NAME.TrimStart('v'))

      # Same names in every release, so releases/latest/download/install.ps1 always works.
      - name: Collect the release files
        shell: powershell
        run: |
          $release = (New-Item -ItemType Directory -Force -Path artifacts\release).FullName
          Copy-Item artifacts\installer\DDT.msi $release
          Copy-Item build\Install-Ddt.ps1 (Join-Path $release 'install.ps1')
          $sums = Get-ChildItem $release -File | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          [IO.File]::WriteAllText((Join-Path $release 'SHA256SUMS'), (($sums -join "`n") + "`n"))

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME artifacts/release/DDT.msi artifacts/release/install.ps1 artifacts/release/SHA256SUMS --verify-tag --generate-notes --title "DDT $($env:GITHUB_REF_NAME)"

      # For a pull request to microsoft/winget-pkgs, by hand until a bot account has a fork.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: winget-manifests
          path: artifacts/winget/

  container:
    name: Container image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          tags: |
            ghcr.io/davicloud-net/ddt:${{ steps.version.outputs.version }}
            ghcr.io/davicloud-net/ddt:latest
