name: ddt

services:
  ddt:
    image: ddt:${DDT_TAG:-dev}
    build:
      context: ..
      dockerfile: build/Dockerfile
    # The pxe role binds UDP 67, 4011 and 69 and TCP 8080, and has to see DHCP broadcasts, so it
    # cannot live behind a bridge network. Host networking is a Linux host feature: on Docker
    # Desktop broadcasts are not delivered.
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: [/tmp]
    environment:
      DDT__Roles: ${DDT_ROLES:-web}
      # Host networking puts the database on this host's loopback, at the port db publishes there.
      ConnectionStrings__ddtdb: Host=127.0.0.1;Port=${DDT_DB_PORT:-5433};Database=ddt;Username=ddt;Password=${DDT_DB_PASSWORD:?Set DDT_DB_PASSWORD in build/.env}
      # Every name and address DDT is reached by has to be in the certificate, because the agent
      # validates the hostname against the chain it pins.
      DDT__Https__SubjectAlternativeNames: ${DDT_HOSTNAMES:-}
      # Everything else is on the settings page. A key set here overrides and locks its field there,
      # even with an empty value, so no setting is passed through by default.
    volumes:
      - ddt-store:/var/lib/ddt
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_DB: ddt
      POSTGRES_USER: ddt
      POSTGRES_PASSWORD: ${DDT_DB_PASSWORD:?Set DDT_DB_PASSWORD in build/.env}
    ports: ["127.0.0.1:${DDT_DB_PORT:-5433}:5432"]
    # Over TCP, because the server the image runs while it creates the database answers only on its
    # socket: a check there would report ready before the database exists.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ddt -d ddt"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ddt-db:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  ddt-store:
  ddt-db:
